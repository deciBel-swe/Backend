#postGre
spring.application.name=DeciBel
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5332/DeciBel
spring.datasource.username=DeciBel
spring.datasource.password=DeciBel1234
#updates tables to match on each run
spring.jpa.hibernate.ddl-auto=update
#hibernate & jpa settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
#base url for frontend
app.frontend-base-url=https://decibel.foo
#mail configuration  to email reset password link
#decibel
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<your-email> 
spring.mail.password=<your-app-password>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=<your-email>
# File upload and requests
# We will increase threshold so that max size can be handled and validated using business logic not here
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=2500MB